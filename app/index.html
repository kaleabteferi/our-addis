<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Our Addis</title>
<meta name="theme-color" content="#6B3FA0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Our Addis">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%236B3FA0'/%3E%3Cpath d='M32 46s-13-8-13-17a7 7 0 0 1 13-3 7 7 0 0 1 13 3c0 9-13 17-13 17z' fill='%23F2B93B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@500;700&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
/* Layout: phone-first app shell — scrolling view + fixed bottom tab bar; map tab is full-bleed.
   Palette: jacaranda purple (the trees that bloom over Addis), adey abeba yellow, coffee-plum ink. */
:root{
  --bg:#F5F2F7; --surface:#FFFFFF; --sunk:#EEE9F2; --ink:#2A1E2E; --muted:#6E6274; --line:#E2DAE7;
  --accent:#6B3FA0; --accent-ink:#FFFFFF; --accent-soft:#EDE3F7; --gold:#C98A0B; --gold-bright:#F2B93B; --gold-soft:#FCEFCF;
  --green:#2F7D4F; --green-soft:#DDF0E3; --danger:#B42318; --shadow:0 1px 2px rgba(42,30,46,.06),0 8px 24px rgba(42,30,46,.07);
  --f-display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-eth:"Noto Sans Ethiopic","Nyala","Abyssinica SIL",sans-serif;
  --nav-h:64px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#17121B; --surface:#211A27; --sunk:#1B1520; --ink:#F2ECF5; --muted:#A89BB0; --line:#352B3D;
  --accent:#B58CE8; --accent-ink:#1A1020; --accent-soft:#33244A; --gold:#F2B93B; --gold-bright:#F2B93B; --gold-soft:#3A2C10;
  --green:#6BD39A; --green-soft:#15301F; --danger:#FF7B6E; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
.disp{font-family:var(--f-display);letter-spacing:-.005em}
.eth{font-family:var(--f-eth)}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.84rem}
.num{font-variant-numeric:tabular-nums}

/* shell */
#app{min-height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
.view{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px;display:flex;flex-direction:column;gap:18px}
.view.full{max-width:none;padding:0;height:calc(100dvh - var(--nav-h) - env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px));position:relative}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:900;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.7rem;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .add span.plus{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-18px;box-shadow:var(--shadow)}
nav.tabs .add span.plus svg{width:24px;height:24px}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;font-size:.92rem;text-decoration:none;color:var(--ink);min-height:42px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.gold{background:var(--gold-bright);color:#2A1E2E;border-color:var(--gold-bright)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.55;cursor:default}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.86rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:999px;white-space:nowrap}
.b-fast{background:var(--green-soft);color:var(--green)}
.b-new{background:var(--accent-soft);color:var(--accent)}
.b-fav{background:var(--gold-soft);color:var(--gold)}
.b-wish{border:1px dashed var(--muted);color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.8rem;font-weight:600;color:var(--muted);min-width:0}
.inp{width:100%;min-width:0;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--ink)}
textarea.inp{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>*{min-width:0}
.err{color:var(--danger);font-size:.88rem}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:2000;max-width:calc(100% - 32px)}

/* sync status */
.syncline{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 10px;font-size:.78rem;font-weight:600;color:var(--muted)}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sdot.ok{background:var(--green)}.sdot.wait{background:var(--gold-bright)}.sdot.off{background:var(--muted)}.sdot.err{background:var(--danger)}
.sdot.busy{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.sdot.busy{animation:none}}

/* home */
.hello h1{font-size:clamp(2.1rem,8vw,2.8rem);line-height:1.02}
.hello h1 em{color:var(--accent)}
.today{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.today .dot{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font:700 1.3rem var(--f-eth)}
.today.fast .dot{background:var(--green-soft);color:var(--green)}
.today.fisk .dot{background:var(--gold-soft);color:var(--gold)}
.today b{font-size:1.02rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font:400 1.6rem/1.1 var(--f-display)}
.stat span{font-size:.72rem;color:var(--muted)}
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.strip .ph{flex:0 0 132px;height:168px;border-radius:14px;overflow:hidden;position:relative;scroll-snap-align:start;background:var(--sunk);border:0;padding:0}
.strip .ph img{width:100%;height:100%;object-fit:cover;display:block}
.strip .ph span{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 7px;font-size:.74rem;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));text-align:left}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.li:first-child{border-top:0}
.li .ic{width:36px;height:36px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.li b{display:block;font-weight:600}
.li small{color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;padding-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars i{display:block;width:100%;max-width:26px;border-radius:6px 6px 2px 2px;background:var(--accent);min-height:2px}
.bars span{font-size:.66rem;color:var(--muted)}

/* map */
#map{position:absolute;inset:0;background:var(--sunk)}
.mapbar{position:absolute;z-index:500;top:12px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.mapbar>*{pointer-events:auto;box-shadow:var(--shadow)}
.legend{position:absolute;z-index:500;left:12px;bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:.74rem;display:flex;gap:10px;flex-wrap:wrap;box-shadow:var(--shadow);max-width:calc(100% - 24px)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.pin{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin.visited{background:#6B3FA0}
.pin.regular{background:#B0306B}
.pin.fav{background:#E8A317;color:#2A1E2E}
.pin.wish{background:#fff;border:2px dashed #6B3FA0;color:#6B3FA0}
.pin.idea{background:#9b8fa3;border-width:1.5px;opacity:.85}
.leaflet-container{font-family:var(--f-body)}
.leaflet-popup-content{margin:12px 14px}

/* sheet */
.sheet-back{position:fixed;inset:0;background:rgba(20,12,24,.45);z-index:1500;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 4px}

/* memories */
.month{font:400 1.5rem var(--f-display);margin-top:6px}
.mem{display:flex;flex-direction:column;gap:10px;padding:14px;cursor:pointer;text-align:left;width:100%}
.mem h3{font:400 1.45rem/1.15 var(--f-display)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-radius:12px;overflow:hidden}
.pgrid.n1{grid-template-columns:1fr}.pgrid.n2{grid-template-columns:1fr 1fr}
.pgrid img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--sunk)}
.pgrid.n1 img{aspect-ratio:4/3}
.pgrid .more{position:relative}
.pgrid .more span{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);color:#fff;font-weight:700;font-size:1.1rem}
.stars{color:var(--gold-bright);letter-spacing:1px;white-space:nowrap}
.quote{font-family:var(--f-display);font-size:1.15rem;line-height:1.35;border-left:3px solid var(--accent);padding-left:12px;margin:0}

/* form */
.rate{display:flex;gap:2px}
.rate{flex-wrap:nowrap}
.rate button{border:0;background:none;font-size:clamp(1.15rem,5.4vw,1.5rem);line-height:1;padding:2px 1px;color:var(--line)}
.rate button.on{color:var(--gold-bright)}
.ratings{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ratings>div{background:var(--sunk);border-radius:12px;padding:8px 8px;min-width:0;overflow:hidden}
.ratings small{font-weight:600;color:var(--muted);font-size:.75rem}
.results{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.results button{border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:10px 12px}
.results button:first-child{border-top:0}
.results small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picked{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.minimap{height:220px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs div{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;background:var(--sunk)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:1}
.addph{width:76px;height:76px;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:1.6rem;cursor:pointer}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sunk);border-radius:12px;padding:10px 12px;font-weight:600;font-size:.9rem}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}

/* next */
.pick{display:flex;flex-direction:column;gap:8px}
.pick h3{font:400 1.5rem/1.1 var(--f-display)}
.pick .src{display:flex;gap:6px;flex-wrap:wrap;font-size:.76rem}
.pick .src a{color:var(--muted)}
.think{display:flex;align-items:center;gap:10px;color:var(--muted)}
.think i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--accent-soft);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.think i{animation:none}}

/* lightbox */
.lb{position:fixed;inset:0;background:#000;z-index:3000;display:flex;align-items:center;justify-content:center}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb button{position:absolute;border:0;background:rgba(255,255,255,.14);color:#fff;width:44px;height:44px;border-radius:50%;font-size:1.3rem}
.lb .x{top:calc(12px + env(safe-area-inset-top,0px));right:12px}
.lb .p{left:10px;top:50%}.lb .n{right:10px;top:50%}
.lb .cap{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;right:16px;color:#fff;text-align:center;font-size:.9rem}

/* auth */
.auth{max-width:420px;margin:0 auto;padding:max(40px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;min-height:100%;justify-content:center}
.auth h1{font:400 3rem/1 var(--f-display)}
.auth h1 em{color:var(--accent)}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs" hidden><div class="in">
  <button data-tab="home" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-tab="map" aria-label="Map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.3-7-12a7 7 0 0 1 14 0c0 5.7-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>Map</button>
  <button data-tab="log" class="add" aria-label="Log a visit"><span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
  <button data-tab="memories" aria-label="Memories"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>Memories</button>
  <button data-tab="next" aria-label="Where next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.4L12 15l-1.8-4.6L5.5 9l4.7-1.4z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>Next</button>
</div></nav>
<div class="toast" id="toast" hidden></div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/pmtiles.js"></script>
<script src="vendor/protomaps-leaflet.js"></script>
<script src="fasting.js"></script>
<script src="ideas.js"></script>
<script src="store.js"></script>
